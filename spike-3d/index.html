<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Payton Pizza: 3D test</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M2 3h12L8 15z' fill='%23ffc93c'/%3E%3Crect x='1' y='1.5' width='14' height='2.5' rx='1.2' fill='%23c98a3a'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #hud { position: fixed; left: calc(8px + env(safe-area-inset-left)); top: calc(8px + env(safe-area-inset-top));
         background: rgba(20, 24, 40, .72); border-radius: 12px; padding: 8px 10px; font-size: 12px; line-height: 1.45;
         pointer-events: none; max-width: 62vw; font-variant-numeric: tabular-nums; }
  #hud b { font-size: 15px; }
  #hud .t { opacity: .75; }
  #result { margin-top: 4px; padding-top: 4px; border-top: 1px solid rgba(255, 255, 255, .25); font-weight: 700; }
  #result.pass { color: #9cf07a; } #result.fail { color: #ff8a8a; }
  #btns { position: fixed; right: calc(8px + env(safe-area-inset-right)); top: calc(8px + env(safe-area-inset-top));
          display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  #btns button { font: inherit; font-size: 12px; font-weight: 700; color: #2a1a00; background: #ffd23f; border: 0;
                 border-bottom: 3px solid #c98a00; border-radius: 10px; padding: 8px 10px; min-width: 104px; min-height: 36px;
                 text-align: left; touch-action: manipulation; }
  #btns button:active { transform: translateY(2px); border-bottom-width: 1px; }
  #btns button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  #hint { position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom)); text-align: center;
          font-weight: 800; font-size: 15px; text-shadow: 0 2px 0 rgba(0, 0, 0, .45); pointer-events: none; transition: opacity .8s; }
  .pop { position: fixed; transform: translate(-50%, -50%); font-weight: 900; font-size: 18px; pointer-events: none;
         text-shadow: 0 2px 0 rgba(0, 0, 0, .55), 0 0 6px rgba(0, 0, 0, .35); white-space: nowrap; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px;
         text-align: center; background: #1c2233; font-size: 16px; }
</style>
  <script type="module" crossorigin src="./assets/index-DiYoBlS_.js"></script>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="3D test: a pizza van driving down a street"></canvas>
<div id="hud" aria-live="off">
  <div class="t">Payton Pizza · 3D test</div>
  <div><b id="fps">--</b> frames a second</div>
  <div>average <span id="avg">--</span> · low <span id="low">--</span></div>
  <div class="t"><span id="calls">--</span> draws · <span id="tris">--</span> triangles · <span id="px">--</span></div>
  <div id="result">Measuring… keep driving for 30 seconds</div>
</div>
<div id="btns">
  <button id="bCam" type="button">Camera: Chase</button>
  <button id="bTime" type="button">Time: Day</button>
  <button id="bShadow" type="button">Shadows: On</button>
  <button id="bStress" type="button">Stress: Off</button>
</div>
<div id="hint">Drag to steer · tap a side to throw</div>
<div id="err">This phone or browser could not start 3D drawing (WebGL). That alone answers the test: tell Claude what you see.</div>
</body>
</html>
