<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Payton Pizza</title>
<style>
html,body{margin:0;height:100%;background:#14161c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;background:#000;outline:none}
</style>
</head>
<body>
<canvas id="g" tabindex="0" aria-label="Payton Pizza, an arcade pizza delivery game"></canvas>
<script>
(function(){
'use strict';
/* ===================== setup ===================== */
var W=480,H=800;
var cv=document.getElementById('g'),ctx=cv.getContext('2d');
var SC=1;
function resize(){
  var dpr=Math.min(window.devicePixelRatio||1,3);
  var s=Math.min(window.innerWidth/W,window.innerHeight/H);
  if(!(s>0))s=1;
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
  cv.width=Math.max(1,Math.round(W*s*dpr));cv.height=Math.max(1,Math.round(H*s*dpr));
  SC=cv.width/W;
}
window.addEventListener('resize',resize);resize();

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function pick(a){return a[(Math.random()*a.length)|0];}

/* ===================== saved progress ===================== */
var save={bank:0,owned:[true,false,false,false],ride:0,hi:0,bestDay:0,mute:false};
var KEY='payton-pizza-v1';
function loadSave(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object'){for(var k in save)if(k in s)save[k]=s[k];}}catch(e){}
  if(!Array.isArray(save.owned)||save.owned.length!==4)save.owned=[true,false,false,false];save.owned[0]=true;
  if(!save.owned[save.ride])save.ride=0;}
function writeSave(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
loadSave();

/* ===================== vehicles ===================== */
var VEH=[
 {name:'HOVERBOARD',price:0,spd:1.0,steer:290,cap:6,w:28,h:22,tip:1,heat:1,shield:0,blurb:['Free. Wobbly. Yours.','Small and easy to dodge with.']},
 {name:'DIRT BIKE',price:150,spd:1.14,steer:390,cap:8,w:16,h:38,tip:1,heat:1,shield:0,blurb:['Faster, sharper steering.','Carries 8 pizzas.']},
 {name:'MIDNIGHT COUPE',price:450,spd:1.28,steer:340,cap:10,w:26,h:50,tip:1.2,heat:1,shield:1,blurb:['Fast. Shrugs off 1 crash','per shift. Tips x1.2.']},
 {name:'PAYTON PIZZA VAN',price:1000,spd:1.2,steer:300,cap:16,w:30,h:58,tip:1.5,heat:0.55,shield:1,blurb:['Oven on board: pizzas stay','hot. Tips x1.5. 16 pizzas.']}
];
var V=VEH[0];

/* ===================== world constants ===================== */
var SWL=130,RDL=160,RDR=320,SWR=350;      // sidewalk / road edges
var WALL_L=96,WALL_R=384;                 // house fronts
var LOT=210,HY0=40,HY1=170,LOT0=560;      // lot length, house span in lot, first lot
var YMIN=330,YMAX=650,RANGE=185;
var DAYS=['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY','SUNDAY'];
var ROOFS=[['#e4572e','#b8431f'],['#3d7fd9','#2c5fa8'],['#8b5cf6','#6d43d0'],['#f2a007','#c27e00'],['#2aa198','#1c7a73'],['#e0559b','#b23c78']];
var DULL=[['#7b808c','#5f646f'],['#8a8478','#6c675d'],['#6f7a78','#56605e']];
var SKIN=['#f2c9a0','#d9a577','#a8703f','#7a4a26','#ffdcb8'];
var SHIRT=['#ffffff','#ffd23f','#5ad1ff','#9cf07a','#ff9f6b','#d6a5ff'];
var CARCOL=['#c0392b','#2e86c1','#27ae60','#d4ac0d','#8e44ad','#e67e22','#ecf0f1'];

/* ===================== state ===================== */
var state='title',day=1,score=0,lives=3,cam=0,speed=0,heat=100,streak=0,pizzas=0,shieldLeft=0;
var lots=[],obs=[],pies=[],pops=[],parts=[],decals=[];
var stats=null,finishY=0,tGame=0,shake=0,inv=0,stun=0,throwAnim=0,throwDir=1,throwCd=0;
var carT=0,slowT=0,skateT=0,bannerT=0,hintT=0,overWhy='',garageFrom='title',report=null,newHi=false;
var P={x:240,sy:560,tx:240,ty:560};
var buttons=[],isTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
function Y(wy){return H-(wy-cam);}

/* ===================== audio ===================== */
var AC=null,noiseBuf=null;
function audioInit(){
  if(AC){if(AC.state==='suspended'){try{AC.resume();}catch(e){}}return;}
  try{var A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();
    noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);var d=noiseBuf.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}
}
function tone(f,d,type,v,f2,delay){
  if(!AC||save.mute)return;
  try{var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v||0.06,t);g.gain.exponentialRampToValueAtTime(0.0008,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}
}
function noise(d,v){
  if(!AC||save.mute||!noiseBuf)return;
  try{var t=AC.currentTime,s=AC.createBufferSource(),g=AC.createGain();s.buffer=noiseBuf;
    g.gain.setValueAtTime(v||0.12,t);g.gain.exponentialRampToValueAtTime(0.0008,t+d);
    s.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+d+0.03);}catch(e){}
}
function sfx(n){
  if(n==='throw')tone(520,0.09,'square',0.04,260);
  else if(n==='door'){tone(660,0.08,'square',0.06);tone(880,0.12,'square',0.06,null,0.08);}
  else if(n==='hand'){tone(660,0.07,'square',0.07);tone(880,0.07,'square',0.07,null,0.07);tone(1320,0.18,'square',0.07,null,0.14);}
  else if(n==='smash'){noise(0.25,0.16);tone(1800,0.12,'sawtooth',0.04,400);}
  else if(n==='miss')tone(200,0.14,'triangle',0.08,90);
  else if(n==='bad'){tone(220,0.16,'sawtooth',0.06,140);tone(150,0.22,'sawtooth',0.06,90,0.14);}
  else if(n==='crash'){noise(0.4,0.22);tone(140,0.35,'sawtooth',0.1,40);}
  else if(n==='pickup'){tone(500,0.06,'square',0.06);tone(750,0.06,'square',0.06,null,0.06);tone(1000,0.1,'square',0.06,null,0.12);}
  else if(n==='empty')tone(120,0.08,'square',0.05);
  else if(n==='bark'){tone(380,0.06,'sawtooth',0.07,240);tone(360,0.07,'sawtooth',0.07,220,0.11);}
  else if(n==='beep')tone(900,0.08,'square',0.04);
  else if(n==='ui')tone(700,0.05,'square',0.05);
  else if(n==='buy'){tone(523,0.08,'square',0.06);tone(659,0.08,'square',0.06,null,0.08);tone(784,0.08,'square',0.06,null,0.16);tone(1046,0.22,'square',0.06,null,0.24);}
  else if(n==='win'){tone(523,0.1,'square',0.06);tone(659,0.1,'square',0.06,null,0.1);tone(784,0.1,'square',0.06,null,0.2);tone(1046,0.3,'square',0.06,null,0.3);}
  else if(n==='shield'){tone(300,0.2,'triangle',0.1,600);}
}

/* ===================== building a shift ===================== */
function mk(type,x,y){
  var o={type:type,x:x,y:y,vx:0,vy:0,w:16,h:16,st:0,t:rnd(0,6),side:0,col:'#888',dead:false};
  if(type==='can'){o.w=18;o.h=18;}
  else if(type==='hydrant'){o.w=13;o.h=13;}
  else if(type==='cone'){o.w=13;o.h=13;}
  else if(type==='pothole'){o.w=24;o.h=14;}
  else if(type==='dog'){o.w=16;o.h=18;o.col=pick(['#8d5524','#3b3b3b','#d9b382','#f5f5f5']);}
  else if(type==='dcar'){o.w=46;o.h=24;o.col=pick(CARCOL);}
  else if(type==='carD'||type==='carU'){o.w=24;o.h=48;o.col=pick(CARCOL);}
  else if(type==='skater'){o.w=14;o.h=20;o.col=pick(SHIRT);}
  else if(type==='pickup'){o.w=30;o.h=30;}
  return o;
}
function makeLot(side,y0,cust,d){
  var slots=[62,105,148],di=(Math.random()*3)|0;
  var l={side:side,y0:y0,cust:cust,delivered:false,missed:false,doorY:y0+slots[di],wins:[],roof:cust?pick(ROOFS):pick(DULL),c:null,ph:rnd(0,6)};
  for(var i=0;i<3;i++)if(i!==di)l.wins.push({y:y0+slots[i],broken:false});
  if(cust){
    var r=Math.random(),type='porch',pm=Math.min(0.08+0.07*d,0.55);
    if(r<pm)type='pacer';else if(r<pm+0.35)type='yard';
    var wall=side<0?WALL_L:WALL_R,out=-side;
    var cy=l.doorY+(type==='yard'?(chance(0.5)?-1:1)*rnd(26,36):0);
    l.c={type:type,x:wall+out*(type==='porch'?11:rnd(18,27)),y:cy,by:cy,ph:rnd(0,6),happy:0,skin:pick(SKIN),shirt:pick(SHIRT),hair:pick(['#3b2a1a','#111','#b5651d','#e6c35c','#888'])};
  }
  return l;
}
function buildShift(d){
  lots=[];obs=[];pies=[];pops=[];parts=[];decals=[];
  var n=Math.min(30+3*d,48),pc=Math.min(0.32+0.025*d,0.55),y=LOT0,i,s,o;
  for(i=0;i<n;i++){
    lots.push(makeLot(-1,y,chance(pc),d));
    lots.push(makeLot(1,y,chance(pc),d));
    var sx=[145,335];
    for(s=0;s<2;s++)if(chance(Math.min(0.2+0.04*d,0.6)))obs.push(mk(chance(0.6)?'can':'hydrant',sx[s]+rnd(-7,7),y+rnd(10,LOT-10)));
    if(chance(Math.min(0.1+0.035*d,0.5)))obs.push(mk(chance(0.5)?'cone':'pothole',rnd(178,302),y+rnd(0,LOT)));
    if(d>=2&&chance(Math.min(0.06+0.03*d,0.35))){s=chance(0.5)?-1:1;o=mk('dog',s<0?114:366,y+rnd(60,150));o.side=s;obs.push(o);}
    if(d>=3&&chance(Math.min(0.04+0.025*d,0.3))){s=chance(0.5)?-1:1;o=mk('dcar',s<0?74:406,y+19);o.side=s;obs.push(o);}
    if(i%3===1)obs.push(mk('pickup',rnd(152,328),y+rnd(20,190)));
    y+=LOT;
  }
  var count=0;for(i=0;i<lots.length;i++)if(lots[i].cust)count++;
  var guard=0;
  while(count<12&&guard++<400){var k=(Math.random()*lots.length)|0;if(!lots[k].cust){lots[k]=makeLot(lots[k].side,lots[k].y0,true,d);count++;}}
  finishY=y+240;
  return count;
}
function lotAt(side,wy){
  var i=Math.floor((wy-LOT0)/LOT);if(i<0)return null;
  var l=lots[i*2+(side<0?0:1)];return l||null;
}

/* ===================== run / shift control ===================== */
function startRun(){day=1;score=0;lives=3;newHi=false;startShift();}
function startShift(){
  V=VEH[save.ride];
  var orders=buildShift(day);
  cam=0;P.x=P.tx=280;P.sy=P.ty=590;heat=100;streak=0;pizzas=V.cap;shieldLeft=V.shield;
  inv=0;stun=0;shake=0;throwCd=0;throwAnim=0;
  carT=rnd(1.5,3);slowT=rnd(3,5);skateT=rnd(4,8);bannerT=2.4;if(day===1)hintT=9;
  stats={orders:orders,delivered:0,hand:0,door:0,smash:0,missed:0,tips:0,crashes:0};
  state='play';
}
function addMoney(n){save.bank+=n;if(stats)stats.tips+=n;}
function gameOver(why){
  overWhy=why;state='over';
  if(score>save.hi){save.hi=score;newHi=true;}
  if(day>save.bestDay)save.bestDay=day;
  writeSave();sfx('bad');
}
function endShift(){
  var ratio=stats.orders?stats.delivered/stats.orders:1;
  if(ratio<0.5){gameOver('fired');return;}
  var pay=10+5*day,perfect=(stats.missed===0&&stats.smash===0&&stats.crashes===0)?25:0;
  save.bank+=pay+perfect;score+=perfect?1000:0;
  var title='BARELY EMPLOYED';
  if(perfect)title='EMPLOYEE OF THE DAY';
  else if(stats.smash>=3)title='WINDOW MENACE';
  else if(ratio>=0.9&&stats.hand>=stats.door)title='HAND-OFF HERO';
  else if(ratio>=0.9)title='RELIABLE DRIVER';
  else if(ratio>=0.7)title='DECENT DRIVER';
  report={pay:pay,perfect:perfect,title:title,pct:Math.round(ratio*100),healed:lives<3};
  if(lives<3)lives++;
  if(score>save.hi){save.hi=score;newHi=true;}
  if(day>save.bestDay)save.bestDay=day;
  writeSave();state='report';sfx('win');
}

/* ===================== actions ===================== */
function pop(x,y,txt,col,size){pops.push({x:clamp(x,70,W-70),y:y,txt:txt,col:col||'#fff',t:0,size:size||16});}
function burst(x,y,n,cols,spd){for(var i=0;i<n;i++){var a=rnd(0,6.28),v=rnd(30,spd||160);parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:rnd(0.3,0.7),col:pick(cols),s:rnd(2,4)});}}
function throwPizza(side){
  if(state!=='play'||throwCd>0)return;
  if(pizzas<=0){pop(P.x,P.sy-34,'OUT OF PIZZA!','#ffd23f');sfx('empty');throwCd=0.25;return;}
  pizzas--;throwCd=0.2;throwAnim=0.18;throwDir=side;
  pies.push({x:P.x+side*10,y:cam+H-P.sy,vx:side*410,vy:speed,d:0,side:side,rot:rnd(0,6)});
  sfx('throw');
}
function smartThrow(){
  var py=cam+H-P.sy,best=null,bd=1e9;
  for(var i=0;i<lots.length;i++){var l=lots[i];if(!l.cust||l.delivered||l.missed)continue;
    var dy=l.doorY-py;if(dy<-40||dy>260)continue;
    var wall=l.side<0?WALL_L:WALL_R;if(Math.abs(P.x-wall)>RANGE+10)continue;
    var dd=Math.abs(dy-60);if(dd<bd){bd=dd;best=l;}}
  throwPizza(best?best.side:(P.x<240?-1:1));
}
function deliver(l,hand,p){
  l.delivered=true;l.c.happy=1.4;stats.delivered++;
  var hm=1+heat/100,pts,tip,txt,col,sx=l.c.x,sy=Y(l.c.y)-18;
  if(hand){
    streak++;var m=Math.min(streak,5);
    pts=Math.round(250*hm*m/10)*10;tip=Math.max(1,Math.round(3*hm*(1+0.25*(m-1))*V.tip));stats.hand++;
    txt='HAND-OFF!'+(m>1?' x'+m:'');col='#ffd23f';sfx('hand');
    burst(sx,sy+18,14,['#ffd23f','#fff','#ff9f1c'],200);
    pop(sx,sy,txt,col,20);pop(sx,sy+20,'+'+pts+'  $'+tip,'#fff',14);
  }else{
    pts=Math.round(100*hm/10)*10;tip=Math.max(1,Math.round(1*hm*V.tip));stats.door++;
    sfx('door');pop(sx,sy,'FRONT DOOR','#9cf07a',16);pop(sx,sy+18,'+'+pts+'  $'+tip,'#fff',14);
  }
  score+=pts;addMoney(tip);heat=Math.min(100,heat+40);
}
function crash(o){
  if(shieldLeft>0){shieldLeft--;inv=1.3;shake=0.2;sfx('shield');pop(P.x,P.sy-40,'BUMPER SAVED YOU!','#5ad1ff');return;}
  lives--;inv=1.9;stun=0.6;streak=0;heat=Math.max(0,heat-25);shake=0.45;stats.crashes++;
  sfx('crash');pop(P.x,P.sy-40,'WIPEOUT!','#ff5964',22);
  burst(P.x,P.sy,18,['#fff','#ffd23f','#ff5964','#e8b04a'],240);
  if(lives<=0)gameOver('crash');
}

/* ===================== update ===================== */
var keys={};
function update(dt){
  tGame+=dt;
  var i,l,o,p;
  for(i=pops.length-1;i>=0;i--){p=pops[i];p.t+=dt;p.y-=38*dt;if(p.t>1.2)pops.splice(i,1);}
  for(i=parts.length-1;i>=0;i--){p=parts[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;if(p.t>p.life)parts.splice(i,1);}
  if(shake>0)shake-=dt;
  if(state==='title'){cam+=110*dt;if(cam>finishY-H-300)cam=0;updCustomers(dt);return;}
  if(state!=='play')return;

  if(inv>0)inv-=dt;if(stun>0)stun-=dt;if(throwCd>0)throwCd-=dt;if(throwAnim>0)throwAnim-=dt;
  if(bannerT>0)bannerT-=dt;if(hintT>0)hintT-=dt;

  // steering
  var kx=((keys.ArrowRight||keys.KeyL)?1:0)-((keys.ArrowLeft||keys.KeyJ)?1:0);
  var ky=((keys.ArrowDown||keys.KeyK)?1:0)-((keys.ArrowUp||keys.KeyI)?1:0);
  var st=V.steer*(stun>0?0.4:1);
  if(kx||ky){P.x+=kx*st*dt;P.sy+=ky*250*dt;P.tx=P.x;P.ty=P.sy;}
  else{var mx=st*1.6*dt,my=460*dt;P.x+=clamp(P.tx-P.x,-mx,mx);P.sy+=clamp(P.ty-P.sy,-my,my);}
  var xmin=SWL+V.w/2+1,xmax=SWR-V.w/2-1;
  P.x=clamp(P.x,xmin,xmax);P.sy=clamp(P.sy,YMIN,YMAX);P.tx=clamp(P.tx,xmin,xmax);P.ty=clamp(P.ty,YMIN,YMAX);

  // speed: higher on the screen = faster
  var f=(YMAX-P.sy)/(YMAX-YMIN);
  var base=Math.min(185+13*(day-1),320)*V.spd;
  speed=base*(0.8+0.5*f)*(stun>0?0.35:1);
  cam+=speed*dt;
  heat=Math.max(0,heat-6.5*V.heat*dt);
  var py=cam+H-P.sy;

  // traffic
  var nearEnd=cam+H>finishY-80;
  carT-=dt;if(carT<=0&&!nearEnd){var a=Math.max(1.3,4.2-0.3*day);carT=rnd(a,a+2);o=mk('carD',200+rnd(-8,8),cam+H+70);o.vy=-(110+rnd(0,90));obs.push(o);}
  slowT-=dt;if(slowT<=0&&!nearEnd){var b=Math.max(2.2,6-0.35*day);slowT=rnd(b,b+3);o=mk('carU',280+rnd(-8,8),cam+H+70);o.vy=base*0.42;obs.push(o);}
  if(day>=3){skateT-=dt;if(skateT<=0&&!nearEnd){skateT=rnd(Math.max(3,9-0.5*day),Math.max(6,13-0.5*day));o=mk('skater',chance(0.5)?145:335,cam+H+40);o.bx=o.x;o.vy=-70;obs.push(o);}}

  updCustomers(dt);
  // missed orders
  for(i=0;i<lots.length;i++){l=lots[i];
    if(l.cust&&!l.delivered&&!l.missed&&l.y0+LOT<cam-6){l.missed=true;stats.missed++;streak=0;
      pop(l.side<0?80:W-80,H-70,'MISSED ORDER!','#ff5964',18);sfx('bad');}}

  // obstacles
  var pw=V.w*0.78,ph=V.h*0.78;
  for(i=obs.length-1;i>=0;i--){o=obs[i];o.t+=dt;
    var sy=Y(o.y);
    if(o.type==='dog'){
      if(o.st===0&&sy>230&&sy<H){o.st=1;sfx('bark');}
      if(o.st===1){o.vy=speed*0.8;var dx=P.x-o.x;o.x+=clamp(dx,-125*dt,125*dt);o.x=clamp(o.x,118,362);}
    }else if(o.type==='dcar'){
      if(o.st===0&&sy>200){o.st=1;sfx('beep');}
      if(o.st===1&&sy>310){o.st=2;}
      if(o.st===2){o.x+=-o.side*88*dt;var stop=o.side<0?205:275;if((o.side<0&&o.x>=stop)||(o.side>0&&o.x<=stop)){o.x=stop;o.st=3;}}
    }else if(o.type==='skater'){o.x=o.bx+Math.sin(o.t*3)*9;}
    o.y+=o.vy*dt;
    if(o.y<cam-90){obs.splice(i,1);continue;}
    if(Math.abs(o.x-P.x)<(o.w+pw)/2&&Math.abs(o.y-py)<(o.h+ph)/2){
      if(o.type==='pickup'){var got=Math.min(5,V.cap-pizzas);pizzas+=got;obs.splice(i,1);sfx('pickup');pop(P.x,P.sy-36,got>0?'+'+got+' PIZZAS':'BAG IS FULL','#ffd23f');continue;}
      if(inv<=0){crash(o);if(state!=='play')return;}
    }
  }

  // pizzas in flight
  for(i=pies.length-1;i>=0;i--){p=pies[i];var done=false;
    for(var s=0;s<3&&!done;s++){p.x+=p.vx*dt/3;p.y+=p.vy*dt/3;p.d+=Math.abs(p.vx)*dt/3;done=resolvePie(p);}
    p.rot+=dt*9;
    if(done)pies.splice(i,1);
  }
  if(decals.length>40)decals.splice(0,decals.length-40);

  if(py>=finishY)endShift();
}
function updCustomers(dt){
  for(var i=0;i<lots.length;i++){var l=lots[i];if(!l.cust)continue;var c=l.c;
    if(l.y0>cam+H+50||l.y0+LOT<cam-50)continue;
    if(c.happy>0)c.happy-=dt;
    if(c.type==='pacer'&&!l.delivered)c.y=c.by+Math.sin(tGame*2.1+c.ph)*30;
  }

function missPie(p,txt){
  streak=0;decals.push({x:p.x,y:p.y});sfx('miss');
  pop(p.x,Y(p.y)-12,txt,'#c9ced6',13);
}
function resolvePie(p){
  var i,l,c,wall=p.side<0?WALL_L:WALL_R;
  for(i=0;i<lots.length;i++){l=lots[i];
    if(l.side!==p.side||!l.cust||l.delivered||l.missed)continue;
    if(Math.abs(l.y0+105-p.y)>170)continue;
    c=l.c;var dx=c.x-p.x,dy=c.y-p.y;
    if(dx*dx+dy*dy<13*13){deliver(l,true,p);return true;}
  }
  if((p.side<0&&p.x<=wall)||(p.side>0&&p.x>=wall)){
    l=lotAt(p.side,p.y);
    if(l){var ry=p.y-l.y0;
      if(ry>=HY0&&ry<=HY1){
        if(Math.abs(p.y-l.doorY)<=16){
          if(l.cust&&!l.delivered&&!l.missed){deliver(l,false,p);return true;}
          missPie(p,l.cust?'ALREADY SERVED':'WRONG HOUSE!');return true;
        }
        for(i=0;i<l.wins.length;i++){var w=l.wins[i];
          if(Math.abs(p.y-w.y)<=13){
            if(!w.broken){w.broken=true;stats.smash++;streak=0;score=Math.max(0,score-50);
              var fine=Math.min(5,save.bank);save.bank-=fine;stats.tips-=fine;
              sfx('smash');shake=0.15;burst(wall,Y(w.y),14,['#9ad8ff','#fff','#d6f1ff'],180);
              pop(wall,Y(w.y)-14,'SMASH!  -$'+fine,'#ff5964',17);
            }else missPie(p,'THUNK');
            return true;
          }
        }
        missPie(p,'THUNK');return true;
      }
    }
  }
  if(p.d>=RANGE||p.x<-12||p.x>W+12){
    l=lotAt(p.side,p.y);
    if(l&&l.cust&&!l.delivered&&!l.missed&&Math.abs(p.y-l.doorY)<=18&&Math.abs(p.x-wall)<=24){deliver(l,false,p);return true;}
    missPie(p,'SPLAT');return true;
  }
  return false;
}

  for(i=0;i<parts.length;i++){var p=parts[i];ctx.globalAlpha=clamp(1-p.t/p.life,0,1);R(p.x,p.y,p.s,p.s,p.col);}

  for(i=0;i<pops.length;i++){var q=pops[i];ctx.globalAlpha=clamp(1.2-q.t,0,1);T(q.txt,q.x,q.y,q.size,q.col,'center','#000');}
  ctx.globalAlpha=1;
  ctx.restore();
}

/* ===================== HUD ===================== */
function heart(x,y,on){var c=on?'#ff3b4e':'#4a4d57';circ(x-4,y-2,5,c);circ(x+4,y-2,5,c);tri(x-9,y,x+9,y,x,y+10,c);}
function pad(n,w){var s=String(n);while(s.length<w)s='0'+s;return s;}
function drawHUD(){
  R(0,0,W,60,'rgba(15,16,22,0.9)');
  T('SCORE',10,14,11,'#9aa3b2');T(pad(score,6),10,32,20,'#fff');
  var wk=Math.floor((day-1)/7)+1;
  T(DAYS[(day-1)%7].slice(0,3)+(wk>1?' WK'+wk:''),W/2,14,13,'#ffd23f','center');
  T('ORDERS '+stats.delivered+'/'+stats.orders,W/2,33,13,stats.missed?'#ffb4b4':'#cfd6e3','center');
  T('$'+save.bank,W-86,32,16,'#9cf07a','right');
  // pause + mute
  RR(W-76,6,32,30,6,'#2a2e3a');R(W-66,13,4,16,'#fff');R(W-58,13,4,16,'#fff');
  RR(W-38,6,32,30,6,'#2a2e3a');T(save.mute?'OFF':'SND',W-22,21,10,save.mute?'#ff8a8a':'#fff','center');
  for(var i=0;i<3;i++)heart(22+i*24,50,i<lives);
  pizzaBox(108,51,7);T('x'+pizzas,120,51,15,pizzas===0?'#ff5964':pizzas<=2?'#ffd23f':'#fff');
  // heat bar
  T('HOT',176,51,11,'#ff9f1c');
  R(204,45,180,12,'#2a2e3a');
  var hc=heat>60?'#ff5a1f':heat>25?'#ff9f1c':'#5a8dd6';
  R(206,47,176*heat/100,8,hc);
  T('TIP x'+(1+heat/100).toFixed(1),W-10,51,12,'#fff','right');

  if(bannerT>0){
    var a=clamp(bannerT,0,1);ctx.globalAlpha=a;
    R(0,300,W,96,'rgba(15,16,22,0.82)');
    T(DAYS[(day-1)%7],W/2,332,34,'#ffd23f','center','#000');
    T(stats.orders+' ORDERS  -  DELIVER AT LEAST HALF',W/2,372,14,'#fff','center');
    ctx.globalAlpha=1;
  }else if(hintT>0){
    ctx.globalAlpha=clamp(hintT,0,1);
    R(0,H-74,W,74,'rgba(15,16,22,0.82)');
    if(isTouch){T('DRAG to steer  -  higher = faster',W/2,H-52,14,'#fff','center');T('TAP left or right side to THROW',W/2,H-28,14,'#ffd23f','center');}
    else{T('ARROWS steer  -  higher = faster',W/2,H-52,14,'#fff','center');T('Z throw left   X throw right   SPACE auto',W/2,H-28,14,'#ffd23f','center');}
    ctx.globalAlpha=1;
  }
}

/* ===================== screens ===================== */
function btn(x,y,w,h,label,fn,opt){
  opt=opt||{};
  var col=opt.disabled?'#3a3d47':opt.primary?'#d7263d':'#2f3442';
  RR(x,y+4,w,h,10,'rgba(0,0,0,0.45)');RR(x,y,w,h,10,col);
  if(opt.primary&&!opt.disabled){ctx.fillStyle='rgba(255,255,255,0.14)';ctx.fillRect(x+6,y+4,w-12,h/2-4);}
  T(label,x+w/2,y+h/2+1,opt.size||18,opt.disabled?'#8b8f9a':'#fff','center');
  if(!opt.disabled)buttons.push({x:x,y:y,w:w,h:h,fn:fn,key:opt.key||''});
}
function dim(a){R(0,0,W,H,'rgba(12,13,18,'+a+')');}
function drawTitle(){
  dim(0.55);
  var b=Math.sin(tGame*2)*4;
  ctx.save();ctx.translate(W/2,150+b);ctx.rotate(-0.04);
  T('PAYTON',4,4,74,'#7d0013','center');T('PAYTON',0,0,74,'#ffd23f','center','#1a0b0b');
  T('PIZZA',4,82,86,'#7d0013','center');T('PIZZA',0,78,86,'#ff4d2e','center','#1a0b0b');
  ctx.restore();
  slice(W/2,292+b,26);
  T('HOT. FAST. HAND-DELIVERED.',W/2,352,15,'#fff','center','#000');
  btn(90,392,300,62,'START SHIFT',function(){sfx('ui');startRun();},{primary:true,size:24,key:'Enter'});
  btn(90,470,300,52,'GARAGE   $'+save.bank,function(){sfx('ui');garageFrom='title';state='garage';},{key:'KeyG'});
  RR(40,548,400,150,12,'rgba(15,16,22,0.85)');
  T('HOW TO PLAY',W/2,568,14,'#ffd23f','center');
  T('Pizza on the FRONT DOOR = points',W/2,592,13,'#fff','center');
  T('Pizza into the customer\'s HANDS = bonus',W/2,612,13,'#fff','center');
  T('Gray houses did not order. Mind the windows.',W/2,632,12,'#cfd6e3','center');
  if(isTouch){T('DRAG to steer - TAP a side to throw',W/2,660,13,'#9cf07a','center');T('Works with a keyboard too',W/2,680,11,'#9aa3b2','center');}
  else{T('ARROWS steer - Z / X throw - SPACE auto',W/2,660,13,'#9cf07a','center');T('P pause - M sound - works on phones too',W/2,680,11,'#9aa3b2','center');}
  T('HIGH SCORE '+pad(save.hi,6)+(save.bestDay?'   BEST DAY '+save.bestDay:''),W/2,728,14,'#fff','center','#000');
  T('RIDE: '+VEH[save.ride].name,W/2,754,13,'#ffd23f','center','#000');
}
function receipt(x,y,w,h){
  RR(x+5,y+6,w,h,6,'rgba(0,0,0,0.4)');R(x,y,w,h,'#fff8e7');
  ctx.fillStyle='#fff8e7';for(var i=0;i<w;i+=16){ctx.beginPath();ctx.moveTo(x+i,y+h);ctx.lineTo(x+i+8,y+h+8);ctx.lineTo(x+i+16,y+h);ctx.fill();}
}
function row(label,val,y,col){T(label,84,y,15,'#3a2a20');T(val,W-84,y,15,col||'#3a2a20','right');}
function dash(y){ctx.fillStyle='#b9a98f';for(var x=84;x<W-84;x+=10)ctx.fillRect(x,y,6,2);}
function drawReport(){
  dim(0.6);
  receipt(60,90,360,520);
  slice(W/2,128,13);
  T('PAYTON PIZZA',W/2,166,22,'#b3001b','center');
  T(DAYS[(day-1)%7]+' SHIFT TICKET',W/2,190,13,'#3a2a20','center');
  dash(208);
  row('ORDERS DELIVERED',stats.delivered+' / '+stats.orders,236);
  row('  HAND-OFFS',String(stats.hand),262,'#b3001b');
  row('  FRONT DOORS',String(stats.door),288);
  row('MISSED ORDERS',String(stats.missed),314,stats.missed?'#b3001b':'#3a2a20');
  row('WINDOWS SMASHED',String(stats.smash),340,stats.smash?'#b3001b':'#3a2a20');
  row('WIPEOUTS',String(stats.crashes),366,stats.crashes?'#b3001b':'#3a2a20');
  dash(386);
  row('TIPS',(stats.tips<0?'-$'+(-stats.tips):'$'+stats.tips),412);
  row('SHIFT PAY','$'+report.pay,438);
  if(report.perfect)row('PERFECT SHIFT','$'+report.perfect,464,'#1f7a3f');
  dash(484);
  row('BANK','$'+save.bank,510,'#1f7a3f');
  row('SCORE',pad(score,6),536);
  T(report.title,W/2,576,17,'#b3001b','center');
  if(report.healed)T('+1 LIFE',W/2,640,14,'#ff8a8a','center','#000');
  btn(60,664,170,58,'GARAGE',function(){sfx('ui');garageFrom='report';state='garage';},{key:'KeyG'});
  btn(250,664,170,58,'NEXT SHIFT',function(){sfx('ui');day++;startShift();},{primary:true,key:'Enter'});
}
function drawOver(){
  dim(0.7);
  T(overWhy==='fired'?'YOU\'RE FIRED':'WIPED OUT',W/2,180,46,'#ff4d2e','center','#000');
  T(overWhy==='fired'?'Fewer than half the orders got delivered.':'Payton is out of lives.',W/2,228,14,'#fff','center');
  RR(70,270,340,200,12,'rgba(15,16,22,0.9)');
  T('SCORE',110,306,15,'#9aa3b2');T(pad(score,6),370,306,22,'#fff','right');
  T('HIGH SCORE',110,344,15,'#9aa3b2');T(pad(save.hi,6),370,344,22,newHi?'#ffd23f':'#fff','right');
  T('REACHED',110,382,15,'#9aa3b2');T(DAYS[(day-1)%7].slice(0,3)+' (DAY '+day+')',370,382,16,'#fff','right');
  T('BANK',110,420,15,'#9aa3b2');T('$'+save.bank,370,420,22,'#9cf07a','right');
  if(newHi)T('NEW HIGH SCORE!',W/2,452,14,'#ffd23f','center');
  T('Your bank and rides are kept.',W/2,500,13,'#cfd6e3','center');
  btn(90,540,300,62,'TRY AGAIN',function(){sfx('ui');startRun();},{primary:true,size:24,key:'Enter'});
  btn(90,618,300,52,'GARAGE',function(){sfx('ui');garageFrom='title';state='garage';},{key:'KeyG'});
  btn(90,684,300,46,'TITLE',function(){sfx('ui');toTitle();},{size:15,key:'Escape'});
}
function drawGarage(){
  R(0,0,W,H,'#1b1e27');
  ctx.fillStyle='#22262f';for(var y=0;y<H;y+=40)ctx.fillRect(0,y,W,2);
  T('GARAGE',20,38,30,'#ffd23f');T('BANK $'+save.bank,W-20,38,20,'#9cf07a','right');
  for(var i=0;i<4;i++){
    var v=VEH[i],cy=74+i*158,own=save.owned[i],sel=save.ride===i;
    RR(14,cy,W-28,146,12,sel?'#333a4d':'#272b37');
    if(sel){ctx.strokeStyle='#ffd23f';ctx.lineWidth=3;ctx.strokeRect(15.5,cy+1.5,W-31,143);}
    RR(26,cy+12,112,122,8,'#44464f');
    ctx.fillStyle='#f5d547';ctx.fillRect(80,cy+18,3,22);ctx.fillRect(80,cy+64,3,22);ctx.fillRect(80,cy+108,3,20);
    ctx.save();ctx.translate(82,cy+73);ctx.scale(1.7,1.7);drawVeh(i,0,0,0,1,tGame);ctx.restore();
    T(v.name,152,cy+26,18,'#fff');
    T(v.blurb[0],152,cy+50,12,'#cfd6e3');T(v.blurb[1],152,cy+66,12,'#cfd6e3');
    T('SPEED',152,cy+90,11,'#9aa3b2');
    for(var k=0;k<6;k++)R(196+k*11,cy+85,8,10,k<Math.round((v.spd-0.9)*14)?'#ff9f1c':'#3a3f4d');
    T('CARRY '+v.cap,280,cy+90,11,'#9aa3b2');
    (function(i,v){
      if(sel)btn(152,cy+102,300,36,'RIDING',null,{disabled:true,size:15});
      else if(own)btn(152,cy+102,300,36,'RIDE THIS',function(){save.ride=i;V=VEH[i];writeSave();sfx('ui');},{size:15,key:'Digit'+(i+1)});
      else if(save.bank>=v.price)btn(152,cy+102,300,36,'BUY  $'+v.price,function(){save.bank-=v.price;save.owned[i]=true;save.ride=i;V=VEH[i];writeSave();sfx('buy');},{primary:true,size:15,key:'Digit'+(i+1)});
      else btn(152,cy+102,300,36,'$'+v.price+'  (NEED $'+(v.price-save.bank)+' MORE)',null,{disabled:true,size:13});
    })(i,v);
  }
  btn(140,726,200,54,'BACK',function(){sfx('ui');state=garageFrom==='report'?'report':'title';if(state==='title')toTitle();},{primary:true,key:'Escape'});
}
function drawPause(){
  dim(0.65);
  T('PAUSED',W/2,300,48,'#ffd23f','center','#000');
  btn(90,370,300,62,'RESUME',function(){state='play';},{primary:true,size:24,key:'Enter'});
  btn(90,448,300,52,'QUIT TO TITLE',function(){writeSave();toTitle();},{});
}
function toTitle(){state='title';day=3;buildShift(3);cam=0;}

function frameDraw(){
  ctx.setTransform(SC,0,0,SC,0,0);
  buttons=[];
  if(state==='garage'){drawGarage();return;}
  drawWorld();
  if(state==='play'||state==='pause')drawHUD();
  if(state==='title')drawTitle();
  else if(state==='report')drawReport();
  else if(state==='over')drawOver();
  else if(state==='pause')drawPause();
}

/* ===================== input ===================== */
function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function uiTap(p){
  for(var i=buttons.length-1;i>=0;i--){var b=buttons[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){if(b.fn)b.fn();return true;}}
  return false;
}
function toggleMute(){save.mute=!save.mute;writeSave();if(!save.mute)sfx('ui');}
var steerId=null,drag=null;
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();audioInit();try{cv.focus();}catch(err){}
  if(e.pointerType==='touch')isTouch=true;
  var p=pos(e);
  if(state!=='play'){uiTap(p);return;}
  if(p.y<42&&p.x>W-78){if(p.x>W-40)toggleMute();else state='pause';return;}
  if(steerId!==null){throwPizza(p.x<W/2?-1:1);return;}   // second finger = instant throw
  steerId=e.pointerId;drag={sx:p.x,sy:p.y,lx:p.x,ly:p.y,t:performance.now(),moved:0};
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
});
cv.addEventListener('pointermove',function(e){
  if(e.pointerId!==steerId||!drag||state!=='play')return;
  e.preventDefault();
  var p=pos(e),dx=p.x-drag.lx,dy=p.y-drag.ly;
  drag.moved+=Math.abs(dx)+Math.abs(dy);drag.lx=p.x;drag.ly=p.y;
  if(drag.moved>8){P.tx+=dx*1.35;P.ty+=dy*1.15;}
});
function endPtr(e){
  if(e.pointerId!==steerId)return;
  if(drag&&state==='play'&&e.type==='pointerup'&&drag.moved<10&&performance.now()-drag.t<350)throwPizza(drag.sx<W/2?-1:1);
  steerId=null;drag=null;
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('keydown',function(e){
  var c=e.code;
  if(c.indexOf('Arrow')===0||c==='Space')e.preventDefault();
  audioInit();
  if(e.repeat){return;}
  keys[c]=true;
  if(c==='KeyM'){toggleMute();return;}
  if(state==='play'){
    if(c==='KeyZ'||c==='KeyA'||c==='KeyQ')throwPizza(-1);
    else if(c==='KeyX'||c==='KeyD'||c==='KeyE')throwPizza(1);
    else if(c==='Space')smartThrow();
    else if(c==='KeyP'||c==='Escape')state='pause';
    return;
  }
  if(state==='pause'&&(c==='KeyP'||c==='Escape'||c==='Space')){state='play';return;}
  var k=(c==='Space'||c==='NumpadEnter')?'Enter':c;
  for(var i=0;i<buttons.length;i++)if(buttons[i].key===k&&buttons[i].fn){buttons[i].fn();return;}
});
window.addEventListener('keyup',function(e){keys[e.code]=false;});
window.addEventListener('blur',function(){keys={};if(state==='play')state='pause';});
document.addEventListener('visibilitychange',function(){if(document.hidden&&state==='play')state='pause';});

/* ===================== main loop ===================== */
var last=0;
function loop(ts){
  var dt=Math.min(0.034,(ts-last)/1000||0);last=ts;
  try{update(dt);frameDraw();}catch(err){if(window.console)console.error(err);}
  requestAnimationFrame(loop);
}
toTitle();
requestAnimationFrame(loop);
})();
</script>
